plugins { id 'com.android.application' }
android {
    namespace 'com.colin.clipbridge'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.colin.clipbridge'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('CLIPBRIDGE_KEYSTORE')) {
                storeFile file(System.getenv('CLIPBRIDGE_KEYSTORE')); storePassword System.getenv('CLIPBRIDGE_STORE_PASSWORD'); keyAlias 'clipbridge'; keyPassword System.getenv('CLIPBRIDGE_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

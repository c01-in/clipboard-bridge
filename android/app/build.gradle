plugins { id 'com.android.application' }
android {
    namespace 'com.colin.clipbridge'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.colin.clipbridge'; minSdk 26; targetSdk 36; versionCode 5; versionName '0.1.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('CLIPBRIDGE_KEYSTORE')) {
                storeFile file(System.getenv('CLIPBRIDGE_KEYSTORE')); storePassword System.getenv('CLIPBRIDGE_STORE_PASSWORD'); keyAlias 'clipbridge'; keyPassword System.getenv('CLIPBRIDGE_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    implementation 'org.unifiedpush.android:connector:3.0.10'
    implementation 'org.unifiedpush.android:embedded-fcm-distributor:3.0.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
configurations { unifiedPushSources }
dependencies {
    unifiedPushSources 'org.unifiedpush.android:connector:3.0.10:sources@jar'
    unifiedPushSources 'org.unifiedpush.android:embedded-fcm-distributor:3.0.0:sources@jar'
}
tasks.register('bundleUnifiedPushSources', Zip) {
    archiveFileName = 'ClipboardBridge-Android-Library-Sources.zip'
    destinationDirectory = rootProject.layout.projectDirectory.dir('../dist')
    from configurations.unifiedPushSources
    from('src/main/assets/third-party')
    from(rootProject.file('../THIRD_PARTY_NOTICES.md'))
}

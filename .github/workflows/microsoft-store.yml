name: Microsoft Store build and deployment
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v0.x.y tag for publication; empty builds the selected branch only'
        type: string
        required: false
      publish:
        description: 'Submit an update to the Microsoft Store (requires completed first submission and API setup)'
        type: boolean
        default: false
      verify_api:
        description: 'Verify real Store API access without submitting an update'
        type: boolean
        default: false
  push:
    tags: ['v0.*']
permissions:
  contents: read
concurrency:
  group: microsoft-store
  cancel-in-progress: false
jobs:
  store:
    if: github.event_name == 'workflow_dispatch' || vars.MICROSOFT_STORE_UPLOAD_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      STORE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      STORE_TAG: ${{ inputs.tag || github.ref_name }}
      STORE_ENABLED: ${{ vars.MICROSOFT_STORE_UPLOAD_ENABLED }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate requested deployment
        run: |
          $ErrorActionPreference='Stop'
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if($env:STORE_PUBLISH -eq 'true'){
            if($env:STORE_ENABLED -ne 'true'){throw 'Complete and verify Store API setup and the initial Store submission before enabling deployment.'}
            if($env:STORE_TAG -ne ('v'+$version)){throw 'Store publication requires an existing tag matching the source version.'}
            $metadata=Get-Content ('docs/release-notes/'+$env:STORE_TAG+'.store-listing.json') -Raw | ConvertFrom-Json
            if($metadata.version -ne $version -or $metadata.storeId -cne '9PJT9PTSMCJQ' -or !$metadata.description -or !$metadata.releaseNotes){throw 'Matching versioned Microsoft Store description and release notes are required.'}
          }
          ./scripts/Check-Publish.ps1 -IncludeHistory
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build the Store app and signed Android companion
        env:
          ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CLIPBRIDGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if(!$env:ANDROID_KEY -or !$env:CLIPBRIDGE_STORE_PASSWORD){throw 'Configure the existing Android signing secrets; they are needed for the downloadable companion APK.'}
          $env:CLIPBRIDGE_KEYSTORE=Join-Path $env:RUNNER_TEMP 'clipboard-store-companion.jks'
          try{
            [IO.File]::WriteAllBytes($env:CLIPBRIDGE_KEYSTORE,[Convert]::FromBase64String($env:ANDROID_KEY))
            ./scripts/Build.ps1 -UseEnvironmentSigning -JavaHome $env:JAVA_HOME -AndroidSdk $env:ANDROID_HOME
            dotnet run --project windows/Tests/Tests.csproj -c Release --disable-build-servers -m:1
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            ./scripts/Package-WindowsStore.ps1 -PackageRoot dist -OutputDirectory dist/store
            ./scripts/Test-WindowsStore.ps1 -PackageDirectory dist/store -ValidationRoot (Join-Path $env:RUNNER_TEMP 'store-host-validation')
          }finally{
            if(Test-Path -LiteralPath $env:CLIPBRIDGE_KEYSTORE){Remove-Item -LiteralPath $env:CLIPBRIDGE_KEYSTORE -Force}
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-review
          path: |
            dist/store/ClipboardBridge-Store-x64.msix
            dist/store/store-package.json
          if-no-files-found: error
      - name: Verify real Store API authentication
        if: env.STORE_PUBLISH == 'true' || inputs.verify_api
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: ./scripts/Test-MicrosoftStoreAccess.ps1
      - name: Set up the official Microsoft Store CLI
        if: env.STORE_PUBLISH == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit the Store update
        if: env.STORE_PUBLISH == 'true'
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        run: |
          if(!$env:MS_STORE_SELLER_ID){throw 'Missing Store seller identifier.'}
          msstore reconfigure --tenantId $env:MS_STORE_TENANT_ID --sellerId $env:MS_STORE_SELLER_ID --clientId $env:MS_STORE_CLIENT_ID --clientSecret $env:MS_STORE_CLIENT_SECRET
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $identity=Get-Content windows/Store/identity.json -Raw | ConvertFrom-Json
          # Upload first: publish recreates the draft from the last published submission.
          msstore publish (Resolve-Path dist/store/ClipboardBridge-Store-x64.msix).Path -id $identity.storeId --noCommit
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $metadata=Get-Content ('docs/release-notes/'+$env:STORE_TAG+'.store-listing.json') -Raw | ConvertFrom-Json
          $draftJson=msstore submission get $identity.storeId
          if($LASTEXITCODE -ne 0){throw 'Could not read the uploaded Store draft.'}
          $draft=($draftJson -join "`n") | ConvertFrom-Json
          $listing=$draft.listings.'en-us'.baseListing
          if(!$listing){throw 'The existing English Store listing is missing; refusing to replace unrelated metadata.'}
          $listing.description=$metadata.description
          $listing.releaseNotes=$metadata.releaseNotes
          $result=msstore submission update $identity.storeId ($draft | ConvertTo-Json -Depth 100 -Compress)
          if($LASTEXITCODE -ne 0){throw 'Store description/release-note update failed; the draft was not committed.'}
          msstore submission publish $identity.storeId
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          'Update submitted to Microsoft Store. Certification and public availability are separate from upload success.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Record review-only result
        if: env.STORE_PUBLISH != 'true'
        run: "'Built and tested the full MSIX. No Store submission or GitHub release was created.' | Out-File $env:GITHUB_STEP_SUMMARY -Append"

name: Publish
on:
  workflow_dispatch:
  push:
    tags: ['v0.*']
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  build:
    name: Build and test once
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_ENABLED: ${{ vars.GOOGLE_PLAY_UPLOAD_ENABLED }}
      MICROSOFT_STORE_ENABLED: ${{ vars.MICROSOFT_STORE_UPLOAD_ENABLED }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check version and release descriptions
        id: version
        run: |
          $ErrorActionPreference='Stop'
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if($version -notmatch '^0\.\d+\.\d+$'){throw 'Use a 0.x.y release version.'}
          $tag='v'+$version
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag){throw 'Tag and source version differ.'}
          $android=Get-Content android/app/build.gradle -Raw
          if($android -notmatch ("versionName '"+[regex]::Escape($version)+"'")){throw 'Android and Windows versions differ.'}
          foreach($suffix in @('.md','.play.txt','.play-listing.json','.store-listing.json')){
            if(!(Test-Path -LiteralPath ('docs/release-notes/'+$tag+$suffix))){throw "Missing release descriptions: $tag$suffix"}
          }
          $store=Get-Content ('docs/release-notes/'+$tag+'.store-listing.json') -Raw | ConvertFrom-Json
          if($store.version -ne $version -or $store.storeId -cne '9PJT9PTSMCJQ' -or !$store.description -or !$store.releaseNotes){throw 'Invalid Store descriptions.'}
          if($env:GOOGLE_PLAY_ENABLED -ne 'true' -or $env:MICROSOFT_STORE_ENABLED -ne 'true'){throw 'Configure both Store publishers before using Publish.'}
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if($LASTEXITCODE -eq 0){throw "Version $tag is already published. Prepare a new version before clicking Publish."}
          $LASTEXITCODE=0
          $existing=git rev-parse -q --verify ('refs/tags/'+$tag) 2>$null
          if($LASTEXITCODE -eq 0 -and $existing -ne $env:GITHUB_SHA){throw 'Existing tag points to different source; tags are never overwritten.'}
          $LASTEXITCODE=0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          ./scripts/Check-Publish.ps1
          ./scripts/Test-GooglePlay.ps1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore existing Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if(!$env:KEYSTORE_BASE64){throw 'Missing Android signing key.'}
          $keyFile=Join-Path $env:RUNNER_TEMP 'clipboard-release.jks'
          [IO.File]::WriteAllBytes($keyFile,[Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "CLIPBRIDGE_KEYSTORE=$keyFile" >> $env:GITHUB_ENV
          "JAVA_TOOL_OPTIONS=-Djdk.net.unixdomain.tmpdir=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Run standard tests and build both apps
        env:
          CLIPBRIDGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if(!$env:CLIPBRIDGE_STORE_PASSWORD){throw 'Missing Android signing password.'}
          dotnet run --project windows/Tests/Tests.csproj -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ./android/gradlew.bat -p android lintRelease --no-daemon --console=plain
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ./scripts/Build.ps1 -UseEnvironmentSigning -JavaHome $env:JAVA_HOME -AndroidSdk $env:ANDROID_HOME
          ./scripts/Package-WindowsStore.ps1 -PackageRoot dist -OutputDirectory dist/store
      - name: Verify signed downloads and prepare GitHub assets
        run: |
          & "$env:ANDROID_HOME/build-tools/36.0.0/apksigner.bat" verify dist/ClipboardBridge.apk
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & "$env:JAVA_HOME/bin/jarsigner.exe" -verify dist/ClipboardBridge.aab
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          foreach($name in @('ClipboardBridge.apk','ClipboardBridge.aab','ClipboardBridge-Android-Library-Sources.zip')){
            Copy-Item -LiteralPath ('dist/'+$name) -Destination ('dist/release/'+$name)
          }
          ./scripts/Get-StoreInstaller.ps1 -OutputPath dist/release/ClipboardBridge-Windows-Store-Setup.exe
          $names=@('ClipboardBridge.apk','ClipboardBridge.aab','ClipboardBridge-Android-Library-Sources.zip','ClipboardBridge-Windows-Store-Setup.exe')
          $checksums=foreach($name in $names){(Get-FileHash ('dist/release/'+$name)).Hash.ToLowerInvariant()+'  '+$name}
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/release/SHA256SUMS.txt'),$checksums,[Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-package
          path: |
            dist/store/ClipboardBridge-Store-x64.msix
            dist/store/store-package.json
          if-no-files-found: error
          retention-days: 3
      - name: Publish GitHub downloads
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets=@(Get-ChildItem -LiteralPath dist/release -File | ForEach-Object {$_.FullName})
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "$env:RELEASE_TAG · Preview" --notes-file ('docs/release-notes/'+$env:RELEASE_TAG+'.md')
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          'GitHub downloads published. Store submissions run next; Store approval is separate.' >> $env:GITHUB_STEP_SUMMARY
      - name: Remove temporary signing key
        if: always()
        run: |
          if($env:CLIPBRIDGE_KEYSTORE -and (Test-Path -LiteralPath $env:CLIPBRIDGE_KEYSTORE)){Remove-Item -LiteralPath $env:CLIPBRIDGE_KEYSTORE -Force}
  play:
    name: Submit Google Play
    needs: build
    uses: ./.github/workflows/play-publish.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      mode: submit
      track: production
    secrets: inherit
  store:
    name: Submit Microsoft Store
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      STORE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.tag }}
      - name: Download the already built Store package
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name store-package --dir dist/store
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $receipt=Get-Content dist/store/store-package.json -Raw | ConvertFrom-Json
          if($receipt.sha256 -cne (Get-FileHash dist/store/ClipboardBridge-Store-x64.msix).Hash){throw 'Store package checksum mismatch.'}
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Upload package and updated descriptions
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        run: |
          foreach($name in @('MS_STORE_TENANT_ID','MS_STORE_CLIENT_ID','MS_STORE_CLIENT_SECRET','MS_STORE_SELLER_ID')){
            if(![Environment]::GetEnvironmentVariable($name)){throw "Missing Store publisher setting: $name"}
          }
          msstore reconfigure --tenantId $env:MS_STORE_TENANT_ID --sellerId $env:MS_STORE_SELLER_ID --clientId $env:MS_STORE_CLIENT_ID --clientSecret $env:MS_STORE_CLIENT_SECRET
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $identity=Get-Content windows/Store/identity.json -Raw | ConvertFrom-Json
          msstore publish (Resolve-Path dist/store/ClipboardBridge-Store-x64.msix).Path -id $identity.storeId --noCommit
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $metadata=Get-Content ('docs/release-notes/'+$env:STORE_TAG+'.store-listing.json') -Raw | ConvertFrom-Json
          $draftJson=msstore submission get $identity.storeId
          if($LASTEXITCODE -ne 0){throw 'Could not read the uploaded Store draft.'}
          $draft=($draftJson -join "`n") | ConvertFrom-Json
          $listing=$draft.listings.'en-us'.baseListing
          if(!$listing){throw 'The existing English Store listing is missing.'}
          $listing.description=$metadata.description
          $listing.releaseNotes=$metadata.releaseNotes
          $result=msstore submission update $identity.storeId ($draft | ConvertTo-Json -Depth 100 -Compress)
          if($LASTEXITCODE -ne 0){throw 'Store descriptions were not saved; submission stopped.'}
          msstore submission publish $identity.storeId
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          'Submitted to Microsoft Store. Certification and public availability remain separate.' >> $env:GITHUB_STEP_SUMMARY

name: Build and publish preview installers
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing preview tag, e.g. v0.1.4'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CLIPBRIDGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate preview tag and versions
        run: |
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if($env:RELEASE_TAG -notmatch '^v0\.\d+\.\d+$' -or $env:RELEASE_TAG -ne ('v'+$version)){throw 'Tag must match the declared 0.x.y preview version.'}
          $android=Get-Content android/app/build.gradle -Raw
          if($android -notmatch ('versionName '''+[regex]::Escape($version)+'''')){throw 'Android and Windows versions differ.'}
          ./scripts/Check-Publish.ps1 -IncludeHistory
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if(!$env:KEYSTORE_BASE64 -or !$env:CLIPBRIDGE_STORE_PASSWORD){throw 'Configure the two Android signing secrets before publishing.'}
          $keyFile=Join-Path $env:RUNNER_TEMP 'clipboard-release.jks'
          [IO.File]::WriteAllBytes($keyFile,[Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "CLIPBRIDGE_KEYSTORE=$keyFile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_TOOL_OPTIONS=-Djdk.net.unixdomain.tmpdir=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run protocol, localization and download checks
        run: |
          dotnet run --project windows/Tests/Tests.csproj -c Release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ./android/gradlew.bat -p android lintDebug --no-daemon --console=plain
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Build signed apps and Windows installer
        run: |
          ./scripts/Build.ps1 -UseEnvironmentSigning -JavaHome $env:JAVA_HOME -AndroidSdk $env:ANDROID_HOME
          ./scripts/Package.ps1 -AndroidSdk $env:ANDROID_HOME
          & "$env:ANDROID_HOME/build-tools/36.0.0/apksigner.bat" verify dist/release/ClipboardBridge.apk
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & "$env:JAVA_HOME/bin/jarsigner.exe" -verify dist/release/ClipboardBridge.aab
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $bundle=[IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/release/ClipboardBridge.aab).Path)
          try{
            $entries=@($bundle.Entries.FullName)
            if('BundleConfig.pb' -notin $entries -or 'base/manifest/AndroidManifest.xml' -notin $entries -or !($entries -match '^META-INF/[^/]+\.(RSA|EC|DSA)$')){throw 'The Play upload artifact is not a signed Android App Bundle.'}
          }finally{$bundle.Dispose()}
      - name: Verify fresh Windows install and uninstall
        run: |
          $setup=Start-Process -FilePath (Resolve-Path dist/release/ClipboardBridge-Windows-x64-Setup.exe).Path -ArgumentList '--silent' -Wait -PassThru -WindowStyle Hidden
          if($setup.ExitCode -ne 0){Get-Content "$env:LOCALAPPDATA/ClipboardBridge/install.log";throw 'Installer failed.'}
          if((Get-Service ClipboardBridge).Status -ne 'Running'){throw 'Service is not running.'}
          & "$env:ProgramFiles/ClipboardBridge/cli/ClipboardBridge.Cli.exe" status
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $head=Invoke-WebRequest http://127.0.0.1:45871/app/android -Method Head
          if($head.StatusCode -ne 200 -or [long]($head.Headers['Content-Length'] -join '') -ne (Get-Item dist/release/ClipboardBridge.apk).Length){throw 'Installed APK download is incomplete.'}
          & "$env:ProgramFiles/ClipboardBridge/scripts/Uninstall.ps1"
          if(Test-Path "$env:ProgramFiles/ClipboardBridge"){throw 'Uninstall left installed program files.'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ env.RELEASE_TAG }}
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes=@'
          Preview build for installation testing. Windows and Android use the same 0.x version.

          Downloads: ClipboardBridge.apk (Android), ClipboardBridge.aab (maintainer upload artifact, not a phone installer), ClipboardBridge-Windows-x64-Setup.exe (Windows installer), ClipboardBridge-Windows-x64.zip (manual installation), SHA256SUMS.txt (checksums).

          Automatic local pairing, text and one image, and nine system languages. Android asks for notification permission in the app. No debug mode is required. Existing installs can be updated using the same Android signing key; internal Android version codes continue increasing.

          Android includes a copy/share link to the GitHub Releases page for installing the Windows companion, plus a privacy policy entry. The AAB is built for maintainer evaluation; Google Play approval has not been obtained. See docs/google-play.md for the registration-path review and remaining submission requirements.

          Windows sends encrypted Web Push directly to Google using a per-computer VAPID key. No Firebase project, service-account file, shared sender secret or maintainer relay is required. Google Play Services and Google network access are still required. Android has a persistent pause/resume switch; old receive sessions are discarded after resuming. Existing pairs migrate automatically when both apps are updated.

          UnifiedPush library sources and their respective LGPL-2.1 and Apache-2.0 licenses are provided in ClipboardBridge-Android-Library-Sources.zip and the APK assets. App source is available at this release tag. Short native-device push tests passed; long-term delivery still needs testing.

          The Windows installer is not Authenticode-signed. See README and SECURITY.md before testing.
          '@
          $versionNotes=Join-Path 'docs/release-notes' ($env:RELEASE_TAG+'.md')
          if(Test-Path -LiteralPath $versionNotes){$notes=Get-Content -LiteralPath $versionNotes -Raw}
          $notes | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          gh release create $env:RELEASE_TAG dist/release/ClipboardBridge.apk dist/release/ClipboardBridge.aab dist/release/ClipboardBridge-Windows-x64-Setup.exe dist/release/ClipboardBridge-Windows-x64.zip dist/release/ClipboardBridge-Android-Library-Sources.zip dist/release/SHA256SUMS.txt --verify-tag --prerelease --title "$env:RELEASE_TAG · Preview" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Remove temporary signing material
        if: always()
        run: |
          if($env:CLIPBRIDGE_KEYSTORE -and (Test-Path -LiteralPath $env:CLIPBRIDGE_KEYSTORE)){Remove-Item -LiteralPath $env:CLIPBRIDGE_KEYSTORE -Force}
  play:
    needs: release
    if: vars.GOOGLE_PLAY_UPLOAD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/play-publish.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      mode: submit
      track: production
    secrets: inherit

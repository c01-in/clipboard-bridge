name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag (no rebuild), e.g. v0.1.4'
        required: true
        type: string
      mode:
        description: 'Validate artifact, verify Play access, or submit for review'
        default: validate
        type: choice
        options: [validate, check-access, submit]
      track:
        default: production
        type: choice
        options: [production, internal, alpha, beta]
      replace_review:
        description: 'Explicitly cancel an existing review and submit all pending changes'
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      mode:
        default: submit
        type: string
      track:
        default: production
        type: string
      replace_review:
        default: false
        type: boolean
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read
  id-token: write
concurrency:
  group: google-play-com-colin-clipbridge
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Test publishing safeguards
        run: ./scripts/Test-GooglePlay.ps1
      - name: Verify existing release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if($env:RELEASE_TAG -notmatch '^v0\.\d+\.\d+$'){throw 'Expected a 0.x.y release tag.'}
          $gradle=git show ($env:RELEASE_TAG+':android/app/build.gradle')
          if($LASTEXITCODE -ne 0){throw 'Release tag does not exist.'}
          $gradle=$gradle -join "`n"
          if($gradle -notmatch "versionName '([^']+)'" -or ('v'+$Matches[1]) -ne $env:RELEASE_TAG){throw 'Tag and Android version differ.'}
          if($gradle -notmatch 'versionCode\s+(\d+)'){throw 'Missing Android version code.'}
          "version_code=$($Matches[1])" >> $env:GITHUB_OUTPUT
          if($gradle -notmatch "applicationId 'com.colin.clipbridge'"){throw 'Unexpected Android package.'}
          $out=Join-Path $env:RUNNER_TEMP 'play-release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern ClipboardBridge.aab --pattern SHA256SUMS.txt --dir $out
          if($LASTEXITCODE -ne 0){throw 'Could not download the existing GitHub release.'}
          $matches=@(Get-Content (Join-Path $out 'SHA256SUMS.txt') | Where-Object {$_ -match '^([a-fA-F0-9]{64})\s+\*?ClipboardBridge\.aab$'})
          if($matches.Count -ne 1){throw 'Expected one AAB release checksum.'}
          $sha=($matches[0] -split '\s+')[0]
          $bundle=Join-Path $out 'ClipboardBridge.aab'
          ./scripts/Publish-GooglePlay.ps1 -Mode validate -BundlePath $bundle -Sha256 $sha
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          $notes=Join-Path 'docs/release-notes' ($env:RELEASE_TAG+'.play.txt')
          if(!(Test-Path -LiteralPath $notes)){throw 'Missing version-specific Play release notes.'}
          $text=(Get-Content -LiteralPath $notes -Raw).Trim()
          if(!$text -or $text.Length -gt 500){throw 'Play release notes must contain 1 to 500 characters.'}
          "notes=$notes" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Verify AAB signature
        env:
          BUNDLE_PATH: ${{ steps.artifact.outputs.bundle }}
        run: |
          $verification=& "$env:JAVA_HOME/bin/jarsigner.exe" -verify -verbose $env:BUNDLE_PATH 2>&1
          if($LASTEXITCODE -ne 0 -or ($verification -join "`n") -notmatch 'jar verified\.'){throw 'AAB signature verification failed.'}
          Write-Host 'AAB signature verified.'
      - name: Authenticate with Google workload identity
        id: auth
        if: inputs.mode != 'validate' && vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Check access or submit to Google Play
        if: inputs.mode != 'validate'
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_MODE: ${{ inputs.mode }}
          PLAY_TRACK: ${{ inputs.track }}
          REPLACE_REVIEW: ${{ inputs.replace_review }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUNDLE_PATH: ${{ steps.artifact.outputs.bundle }}
          BUNDLE_SHA256: ${{ steps.artifact.outputs.sha256 }}
          VERSION_CODE: ${{ steps.artifact.outputs.version_code }}
          NOTES_PATH: ${{ steps.artifact.outputs.notes }}
        run: |
          ./scripts/Publish-GooglePlay.ps1 -Mode $env:PLAY_MODE -Track $env:PLAY_TRACK -BundlePath $env:BUNDLE_PATH -Sha256 $env:BUNDLE_SHA256 -VersionCode ([int]$env:VERSION_CODE) -ReleaseName $env:RELEASE_TAG -NotesPath $env:NOTES_PATH -ReplaceReview:($env:REPLACE_REVIEW -eq 'true')

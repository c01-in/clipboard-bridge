name: Build and privacy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Check tracked files and reachable history
        shell: pwsh
        run: ./scripts/Check-Publish.ps1 -IncludeHistory
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Build Windows applications and run checks
        shell: pwsh
        run: |
          dotnet build windows/Service/Service.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows/Tray/Tray.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows/Cli/Cli.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/Tests/Tests.csproj -c Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build without Firebase credentials and run lint
        working-directory: android
        shell: bash
        run: |
          # Fresh runners have intermittently failed to fetch existing Maven artifacts.
          # Retry dependency resolution only; compiler and lint failures stay failures.
          refresh=()
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon assembleDebug lintDebug --console=plain "${refresh[@]}" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
            result=("${PIPESTATUS[@]}")
            set -e
            if (( result[1] != 0 )); then exit "${result[1]}"; fi
            if (( result[0] == 0 )); then exit 0; fi
            if (( attempt == 3 )) || ! grep -Eq 'Could not (find [^ ]+:[^ ]+:[^ ]+|resolve|GET|HEAD|download)' "$RUNNER_TEMP/android-build.log"; then
              exit "${result[0]}"
            fi
            echo "::warning::Dependency fetch failed on attempt $attempt; refreshing dependency metadata before retry."
            refresh=(--refresh-dependencies)
            sleep 10
          done
